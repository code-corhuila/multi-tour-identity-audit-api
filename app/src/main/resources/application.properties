spring.application.name=identity-audit
server.port=${PORT:8082}
spring.main.banner-mode=off

# An unknown route reaches the error translator instead of the default page
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true

# JSON log lines; the correlation id is in the MDC and so in every line
logging.structured.format.console=logstash

# Limits of the composition root (Annex C): each one declared, none a framework default left unsaid
# Header read: Tomcat has no separate header timeout; this is a per-read timeout of the socket (request line,
# headers and body), not a total deadline, so it approximates the 5 s of the annex
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=60s
server.max-http-request-header-size=4KB
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Deviations, declared: Tomcat has no response-write timeout (the 15 s of the annex is not enforced here; the
# gateway is the place to enforce it, not yet verified), and a JSON body has no size limit yet (set it with the
# first route that reads a body). Requests that Tomcat refuses before the filters (431, a malformed line, a read
# timeout) leave no access line.
# The access line of the filter already says it, and this warning writes the whole path
logging.level.org.springframework.web.servlet.PageNotFound=ERROR
