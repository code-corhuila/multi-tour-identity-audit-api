name: ci

# Every pull request toward develop and qa builds the repository and runs its tests on a clean machine
# (norm 5.1). No schedule: GitHub Actions minutes are limited.
on:
  pull_request:
    branches: [develop, qa]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - name: Build the image, start it and check what it publishes
        # Same versions as the defaults of the script, from registries without the anonymous limit of
        # Docker Hub, which a shared runner address reaches (429 Too Many Requests)
        env:
          MAVEN_IMAGE: public.ecr.aws/docker/library/maven:3.9.9-eclipse-temurin-21
          JRE_IMAGE: public.ecr.aws/docker/library/eclipse-temurin:21.0.8_9-jre
        run: sh deploy/tests/deploy-check.sh
