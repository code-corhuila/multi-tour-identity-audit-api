name: ci

# Every pull request toward develop and qa builds the repository and runs its tests on a clean machine
# (norm 5.1). No schedule: GitHub Actions minutes are limited.
on:
  pull_request:
    branches: [develop, qa]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare the database the integration tests run against
        # The database is the one multi-tour-identity-audit-db builds (norm 5.2.1). Same versions as the defaults of
        # the script, from registries without the anonymous limit of Docker Hub (429 Too Many Requests)
        env:
          MONGO_IMAGE: public.ecr.aws/docker/library/mongo:8.0.32
          LIQUIBASE_BASE: ghcr.io/liquibase/liquibase:5.0.4
          # The commit of multi-tour-identity-audit-db the tests run against; moved on purpose, with the change here that needs it
          DB_REPO_REF: 44d3468479e5968a13ace1df0dadd7af82c58115
        run: |
          url=$(sh scripts/prepare-test-db.sh up)
          echo "TEST_DATABASE_URL=$url" >> "$GITHUB_ENV"
      - run: mvn -B verify
      - name: The integration tests ran and none was skipped
        run: |
          reports=$(ls adapters/target/surefire-reports/*Mongo*Test.txt)
          [ "$(echo "$reports" | wc -l)" -ge 2 ] || { echo "an integration test class has no report"; exit 1; }
          for report in $reports; do
            grep -h "Tests run" "$report" | grep -Eq "Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: 0"               || { echo "$report: tests were skipped or did not run"; exit 1; }
          done
      - name: Build the image, start it and check what it publishes
        # Same versions as the defaults of the script, from registries without the anonymous limit of
        # Docker Hub, which a shared runner address reaches (429 Too Many Requests)
        env:
          MAVEN_IMAGE: public.ecr.aws/docker/library/maven:3.9.9-eclipse-temurin-21
          JRE_IMAGE: public.ecr.aws/docker/library/eclipse-temurin:21.0.8_9-jre
        run: sh deploy/tests/deploy-check.sh
