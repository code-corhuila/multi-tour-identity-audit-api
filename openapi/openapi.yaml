openapi: 3.0.3
info:
  title: Identity Audit API
  version: 0.17.0
  description: |
    The contract this service is tested against (ADR-004 D7). It grows with each operation, written before the
    code; the design contract lives in `07-api/contracts/openapi/identity-audit.yaml` of `multi-tour-docs`.
    The paths are the real ones, with the prefix `/api/v1/identity-audit` that the gateway routes to this
    service. Every error uses the single envelope below. Routes under `/internal/` answer only the role `SERVICE`.
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: The service is up
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp, dependencies]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  timestamp:
                    type: string
                    format: date-time
                  dependencies:
                    type: object
                    required: [database]
                    properties:
                      database:
                        type: string
                        enum: [ok, down]
                        description: Whether the database answered a ping within 2 s; a database that is down does not make the answer a 503
  /api/v1/identity-audit/internal/tenants:
    post:
      summary: Step 1 of onboard-tenant, create the tenant as pending
      description: A repeat of the same `Idempotency-Key` answers `200` with the first tenant, whatever the body says now. Role `SERVICE`.
      operationId: registerPendingTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTenantRequest'
      responses:
        '201':
          description: Tenant created as pending
          headers:
            Location:
              description: Path of the created tenant
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '200':
          description: Repeated request with the same `Idempotency-Key`; the tenant already created, as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          description: The identifier is used by a live tenant; the message names it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/internal/tenants/{tenantId}/complete-onboarding:
    post:
      summary: Step 3 of onboard-tenant, record the first Administrator and apply the initial status
      description: A pending tenant becomes `ACTIVE` or `INACTIVE` and `TenantCreated` goes to the outbox in the same transaction; the same Administrator again answers `200`. Role `SERVICE`.
      operationId: completeTenantOnboarding
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOnboardingRequest'
      responses:
        '200':
          description: Onboarding completed, or already completed with this Administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          description: The tenant is not pending (`INVALID_STATUS_TRANSITION`), or the change lost the race twice in a row (`BUSINESS_RULE_VIOLATION`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/internal/tenants/{tenantId}/fail-onboarding:
    post:
      summary: Compensation of onboard-tenant, mark the pending tenant failed
      description: A pending tenant becomes `FAILED` with the step that failed, freeing its identifier; the same step again answers `200`. Role `SERVICE`.
      operationId: failTenantOnboarding
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailOnboardingRequest'
      responses:
        '200':
          description: The tenant is marked failed, or already was with this step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          description: The tenant is not pending (`INVALID_STATUS_TRANSITION`), or the change lost the race twice in a row (`BUSINESS_RULE_VIOLATION`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/tenants:
    get:
      summary: List the tenants, newest first
      description: A `limit` outside 1 to 100, a `page` below 1, a status that does not exist or a filter that is not declared is `400`. Role `PLATFORM_ADMINISTRATOR`.
      operationId: listTenants
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: status
          in: query
          schema: {type: string, enum: [PENDING, ACTIVE, INACTIVE, FAILED]}
      responses:
        '200':
          description: One page of tenants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/tenants/{tenantId}:
    get:
      summary: Get a tenant, whatever its status
      description: Role `PLATFORM_ADMINISTRATOR`; a tenant user is refused with `403`.
      operationId: getTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
      responses:
        '200':
          description: The tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/tenants/{tenantId}/inactivate:
    post:
      summary: Inactivate an active tenant, with a reason
      description: The reason is required. A tenant that is not active, a repeat included, is `422 INVALID_STATUS_TRANSITION`. Writes `TenantInactivated` to the outbox in the same transaction. Role `PLATFORM_ADMINISTRATOR`.
      operationId: inactivateTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionReasonRequest'
      responses:
        '200':
          description: Tenant inactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          description: The tenant is not active (`INVALID_STATUS_TRANSITION`), or the change lost the race twice in a row (`BUSINESS_RULE_VIOLATION`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/tenants/{tenantId}/reactivate:
    post:
      summary: Reactivate an inactive tenant, with a reason
      description: The reason is required. A tenant that is not inactive, a repeat included, is `422 INVALID_STATUS_TRANSITION`. Writes `TenantReactivated` to the outbox in the same transaction. Role `PLATFORM_ADMINISTRATOR`.
      operationId: reactivateTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionReasonRequest'
      responses:
        '200':
          description: Tenant reactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          description: The tenant is not inactive (`INVALID_STATUS_TRANSITION`), or the change lost the race twice in a row (`BUSINESS_RULE_VIOLATION`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/tenant/visual-identity:
    put:
      summary: Set the visual identity of the caller's tenant
      description: Replaces the two colors of the tenant named by the token's `tenantId` claim; the path and the body name no tenant, so another tenant cannot be asked for. The same body again answers `200` with the same state, and no `Idempotency-Key` is asked because nothing is created. A field that is not declared, a `tenantId` included, or a color that is not `#RRGGBB` is `400` naming the field. Role `TENANT_ADMINISTRATOR`; the Platform Administrator, a `SERVICE` and any other role are `403`.
      operationId: setTenantVisualIdentity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisualIdentityRequest'
      responses:
        '200':
          description: The visual identity is set; the tenant is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          description: The tenant is not active, or it was inactivated while the request was being decided (`BUSINESS_RULE_VIOLATION`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/tenant/audit-access:
    get:
      summary: The audit access of the optional roles of the caller's tenant
      description: The three optional roles and whether each may consult the audit of the tenant named by the token's `tenantId` claim; a role never set is `false`. Always the three, so it is not paginated and has no `meta`. Role `TENANT_ADMINISTRATOR`; the Platform Administrator, a `SERVICE` and any other role are `403`.
      operationId: listAuditAccess
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The three optional roles, always all three
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    minItems: 3
                    maxItems: 3
                    items:
                      $ref: '#/components/schemas/AuditAccessResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/tenant/audit-access/{role}:
    put:
      summary: Enable or remove the audit access of an optional role
      description: Sets whether the role may consult the audit of the caller's tenant; the tenant never comes from the path or the body. A real change keeps, in the same transaction, the audit record `AUDIT_ACCESS_ENABLED` or `AUDIT_ACCESS_DISABLED` with who and when. It is idempotent by nature, so it takes no `Idempotency-Key`; setting what is already set answers `200` and records nothing. A role that is not one of the three, a field that is not declared or a missing `enabled` is `400`, and the value of the role is not repeated. Role `TENANT_ADMINISTRATOR`.
      operationId: setAuditAccess
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OptionalRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditAccessRequest'
      responses:
        '200':
          description: The access as it is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditAccessResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          description: The setting changed while the request was being decided twice in a row (`BUSINESS_RULE_VIOLATION`); the caller sends it again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/audit-records:
    get:
      summary: List the audit across tenants
      description: The audit records of every tenant, newest first, and by id among equal times. `tenantId` narrows it to one tenant. A `limit` outside 1 to 100, a `page` below 1, a period that ends before it starts, an action that does not exist, a filter that is not declared or one sent twice is `400`. Role `PLATFORM_ADMINISTRATOR`; a user of a tenant, of any role, and a `SERVICE` are `403`.
      operationId: listPlatformAuditRecords
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: query
          description: Only the records of this tenant
          schema: {type: string, format: uuid}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: from
          in: query
          description: Start of the period, RFC 3339 in UTC, inclusive
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: End of the period, RFC 3339 in UTC, exclusive; before `from` is `400`
          schema: {type: string, format: date-time}
        - name: action
          in: query
          description: Only the records of this action; any other is `400`
          schema:
            type: string
            enum: [ACCOUNT_SESSIONS_REVOKED, ACCOUNT_BLOCKED, SPECIAL_PERMISSION_GRANTED, SPECIAL_PERMISSION_REVOKED, OPTIONAL_ROLE_ENABLED, OPTIONAL_ROLE_DISABLED, TENANT_CREATED, TENANT_INACTIVATED, TENANT_REACTIVATED, AUDIT_ACCESS_ENABLED, AUDIT_ACCESS_DISABLED]
      responses:
        '200':
          description: One page of audit records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecordPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/tenants/{tenantId}/audit-records:
    get:
      summary: List the audit of one tenant
      description: The audit records of the tenant, newest first. Read by its `TENANT_ADMINISTRATOR`, and by a `MANAGER`, `ACCOUNTANT` or `ANALYST` only while the audit access of their role is enabled in that tenant. The tenant of the path must be the token's `tenantId`; another tenant is `404` for every role, judged before the role. The Platform Administrator, a `SERVICE`, a collaborator and a final customer are `403`. A query that is malformed is `400` whoever asks. A filter that is not declared, `tenantId` included, is `400`.
      operationId: listAuditRecords
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: from
          in: query
          description: Start of the period, RFC 3339 in UTC, inclusive
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: End of the period, RFC 3339 in UTC, exclusive; before `from` is `400`
          schema: {type: string, format: date-time}
        - name: action
          in: query
          description: Only the records of this action; any other is `400`
          schema:
            type: string
            enum: [ACCOUNT_SESSIONS_REVOKED, ACCOUNT_BLOCKED, SPECIAL_PERMISSION_GRANTED, SPECIAL_PERMISSION_REVOKED, OPTIONAL_ROLE_ENABLED, OPTIONAL_ROLE_DISABLED, TENANT_CREATED, TENANT_INACTIVATED, TENANT_REACTIVATED, AUDIT_ACCESS_ENABLED, AUDIT_ACCESS_DISABLED]
      responses:
        '200':
          description: One page of audit records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecordPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/public/tenants/{identifier}:
    get:
      summary: Public profile of a tenant, behind the link /t/{identifier}
      description: It reveals the name, the identifier, the status and the visual identity (`null` while none was set), nothing more. A tenant that is unknown, pending or failed is `404`; an inactive one answers `200` with its status. No token.
      operationId: getPublicTenantProfile
      security: []
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9-]{1,40}$'
      responses:
        '200':
          description: The public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPublicProfile'
        '401':
          description: The path is not written like an identifier (capitals, encoded characters, more than 40), so it is not public and needs a token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/internal/tenants/{tenantId}/events:
    post:
      summary: Receive an event of another service
      description: |
        Job 7 delivers the events of the security microservice (ADR-004 D4 and D5). Each one becomes one audit record
        (HU-IDA-002 AC1): the action is the event type in SCREAMING_SNAKE_CASE, the actor is `actorId` or, when the
        event has none, `multi-tour-security`, the record affected is `accounts/{aggregateId}` (`tenants/{aggregateId}`
        for the optional-role events), the new value is the payload, the time is `occurredAt`, and `previousValue`,
        `channelOrModule` and `functionalProcessReference` are read from the payload when it has them (AC2).
        `AccountSessionsRevoked` also names, in its payload, the account and the time from which its sessions no longer
        count: the service keeps, per account, the latest cutoff it received and answers `401` to a token of that
        account issued before it. The `Idempotency-Key` is the id of the event. The first time is `201`; a repeat of
        the event id is `200` and keeps nothing new (AC7), and so is a revocation older than the cutoff already kept.
        The tenant of the path must be the one of the event. Only the role `SERVICE`. The body is tolerant of fields it
        does not name, up to 16 KB.
      operationId: receiveSessionEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformEventEnvelope'
      responses:
        '201':
          description: The event was recorded
        '200':
          description: The event was already received, or it is a revocation older than the cutoff already kept
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          description: The change lost the race twice in a row (`BUSINESS_RULE_VIOLATION`); the caller sends it again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/internal/events:
    post:
      summary: Receive an event that belongs to no tenant
      description: |
        The route of the events that carry no `tenantId`: those of a Platform Administrator's account, which has no
        tenant (ADR-004 D4). Job 7 sends here the event types this service consumes when the event has no tenant; an
        event that has one goes to `/internal/tenants/{tenantId}/events`. Each route answers `400` to the envelope of
        the other, so an event is never recorded under another tenant, or under none, by mistake. The body is the same
        envelope and what is done with it is the same: one audit record with `tenantId` null (`201` the first time,
        `200` for a repeat of the event id), and for `AccountSessionsRevoked` the cutoff of the account, which has no
        tenant either. An account whose cutoff holds a tenant is refused with `400`: an account belongs to one tenant
        or to none. Only the role `SERVICE`. The body is tolerant of fields it does not name, up to 16 KB.
      operationId: receivePlatformEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformEventEnvelope'
      responses:
        '201':
          description: The event was recorded
        '200':
          description: The event was already received, or it is a revocation older than the cutoff already kept
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          description: The change lost the race twice in a row (`BUSINESS_RULE_VIOLATION`); the caller sends it again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/internal/outbox:
    get:
      summary: Read the events waiting, for job 7
      description: The pending events that are due, across tenants, the one due for longest first. A `limit` outside 1 to 100, a status other than `PENDING` and a filter that is not declared are `400`. Role `SERVICE`.
      operationId: listOutboxEvents
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: status
          in: query
          schema: {type: string, enum: [PENDING], default: PENDING}
      responses:
        '200':
          description: One page of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/internal/outbox/{eventId}/published:
    post:
      summary: Mark an event delivered
      description: Only after every consumer answered `201` or `200`. A repeat answers `200` with the event as it is. Role `SERVICE`.
      operationId: markOutboxEventPublished
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
      responses:
        '200':
          description: The event is published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEvent'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          description: The change lost the race twice in a row (`BUSINESS_RULE_VIOLATION`); the caller sends it again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/identity-audit/internal/outbox/{eventId}/attempts:
    post:
      summary: Record a failed delivery
      description: Counts the attempt, keeps the error and moves `nextAttemptAt` (the wait doubles from 5 s up to 15 min); the 20th attempt marks the event `FAILED`. An event that is no longer pending is answered as it is. Role `SERVICE`.
      operationId: recordOutboxEventAttempt
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboxAttemptRequest'
      responses:
        '200':
          description: The attempt is recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEvent'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          description: The change lost the race twice in a row (`BUSINESS_RULE_VIOLATION`); the caller sends it again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^\S+$'
    TenantIdPath:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventIdPath:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: An error in the single envelope; the code says which
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error, message, traceId]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        traceId:
          type: string
    RegisterTenantRequest:
      type: object
      required: [identifier, commercialName, timeZone, country]
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 40
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        commercialName:
          type: string
          minLength: 1
          maxLength: 120
        timeZone:
          type: string
          maxLength: 64
        country:
          type: string
          pattern: '^[A-Z]{2}$'
    CompleteOnboardingRequest:
      type: object
      required: [firstAdministratorMembershipId, initialStatus]
      additionalProperties: false
      properties:
        firstAdministratorMembershipId:
          type: string
          format: uuid
        initialStatus:
          type: string
          enum: [ACTIVE, INACTIVE]
    FailOnboardingRequest:
      type: object
      required: [failedStep]
      additionalProperties: false
      properties:
        failedStep:
          type: string
          enum: [CREATE_ACCOUNT, APPLY_STATUS]
    TenantPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TenantResponse'
        meta:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page: {type: integer, minimum: 1}
            limit: {type: integer, minimum: 1, maximum: 100}
            total: {type: integer, minimum: 0}
            totalPages: {type: integer, minimum: 0}
    TransitionReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          description: Trimmed; no control character, new lines included; at most 500 UTF-16 units
          minLength: 1
          maxLength: 500
    TenantPublicProfile:
      type: object
      required: [identifier, commercialName, tenantStatus]
      additionalProperties: false
      properties:
        identifier:
          type: string
        commercialName:
          type: string
        tenantStatus:
          type: string
          enum: [ACTIVE, INACTIVE]
        visualIdentity:
          $ref: '#/components/schemas/VisualIdentity'
    HexColor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      description: A color written `#RRGGBB`; the service keeps it in capitals
    VisualIdentity:
      type: object
      nullable: true
      description: 'The two colors of a tenant; null when it has not set them and the platform default applies'
      required: [primaryColor, secondaryColor]
      additionalProperties: false
      properties:
        primaryColor:
          $ref: '#/components/schemas/HexColor'
        secondaryColor:
          $ref: '#/components/schemas/HexColor'
    AuditRecordResponse:
      type: object
      description: Immutable audit evidence; `tenantId` is null for an action of the platform
      required: [auditRecordId, tenantId, actorId, action, affectedRecordId, recordedAt]
      properties:
        auditRecordId: {type: string, format: uuid}
        tenantId: {type: string, format: uuid, nullable: true}
        actorId: {type: string, description: The account id of the person or the name of the service that did it}
        action: {type: string, description: The type of the event in SCREAMING_SNAKE_CASE; a publisher that is new may bring one that is not in the list of the filter}
        affectedRecordId: {type: string}
        reason: {type: string, nullable: true}
        previousValue: {type: object, nullable: true, additionalProperties: true}
        newValue: {type: object, nullable: true, additionalProperties: true}
        channelOrModule: {type: string, nullable: true}
        functionalProcessReference: {type: string, nullable: true}
        recordedAt: {type: string, format: date-time}
    AuditRecordPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecordResponse'
        meta:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page: {type: integer, minimum: 1}
            limit: {type: integer, minimum: 1, maximum: 100}
            total: {type: integer, minimum: 0}
            totalPages: {type: integer, minimum: 0}
    OptionalRole:
      type: string
      enum: [MANAGER, ACCOUNTANT, ANALYST]
    AuditAccessRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: {type: boolean}
    AuditAccessResponse:
      type: object
      required: [role, enabled]
      properties:
        role:
          $ref: '#/components/schemas/OptionalRole'
        enabled: {type: boolean}
        changedBy: {type: string, format: uuid, nullable: true, description: The account that changed it last; null if it was never set}
        changedAt: {type: string, format: date-time, nullable: true}
    VisualIdentityRequest:
      type: object
      description: Both colors are always sent (PUT replaces); nothing else can be set
      required: [primaryColor, secondaryColor]
      additionalProperties: false
      properties:
        primaryColor:
          $ref: '#/components/schemas/HexColor'
        secondaryColor:
          $ref: '#/components/schemas/HexColor'
    OutboxPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OutboxEvent'
        meta:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page: {type: integer, minimum: 1}
            limit: {type: integer, minimum: 1, maximum: 100}
            total: {type: integer, minimum: 0}
            totalPages: {type: integer, minimum: 0}
    OutboxAttemptRequest:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: Trimmed; no control character, new lines included; at most 1000 UTF-16 units
          minLength: 1
          maxLength: 1000
    PlatformEventEnvelope:
      type: object
      description: |
        The envelope of ADR-004 D4 as job 7 delivers it; fields it does not name are tolerated. The payload of
        `AccountSessionsRevoked` must carry `accountId` and `revokedFrom` (RFC 3339 in UTC), or the event is `400`; any
        other payload is kept as it comes, as the new value of the record.
      required: [eventId, eventType, eventVersion, aggregateId, payload, occurredAt]
      additionalProperties: true
      properties:
        eventId: {type: string, format: uuid}
        eventType:
          type: string
          pattern: '^[A-Z][A-Za-z0-9]{0,63}$'
          description: Any type the relay routes here; today the six events of the security microservice
          example: SpecialPermissionGranted
        eventVersion: {type: integer, minimum: 1}
        tenantId: {type: string, format: uuid, description: "Absent for the accounts of the Platform Administrator; the tenant route requires it and `/internal/events` refuses it"}
        aggregateId: {type: string, format: uuid, description: "The account the event is about, or the tenant for the optional-role events"}
        actorId: {type: string, nullable: true, description: Who did it; absent when the publisher did it on its own}
        reason: {type: string, nullable: true}
        correlationId: {type: string}
        payload:
          type: object
          additionalProperties: true
          description: The full new state of the aggregate; never a credential
        occurredAt: {type: string, format: date-time}
    OutboxEvent:
      type: object
      description: An event waiting to be delivered, with the envelope of ADR-004 D4
      required: [eventId, eventType, eventVersion, aggregateId, payload, correlationId, occurredAt, status, attempts, nextAttemptAt]
      properties:
        eventId: {type: string, format: uuid}
        eventType: {type: string}
        eventVersion: {type: integer, minimum: 1}
        tenantId: {type: string, format: uuid}
        aggregateId: {type: string, format: uuid}
        actorId: {type: string}
        reason: {type: string}
        payload:
          type: object
          description: The full new state of the aggregate; never a credential
        correlationId: {type: string}
        occurredAt: {type: string, format: date-time}
        publishedAt: {type: string, format: date-time}
        status: {type: string, enum: [PENDING, PUBLISHED, FAILED]}
        attempts: {type: integer, minimum: 0}
        lastError: {type: string}
        nextAttemptAt: {type: string, format: date-time}
    TenantResponse:
      type: object
      required: [tenantId, identifier, commercialName, tenantStatus, timeZone, country, createdAt]
      properties:
        tenantId:
          type: string
          format: uuid
        identifier:
          type: string
        commercialName:
          type: string
        tenantStatus:
          type: string
          enum: [PENDING, ACTIVE, INACTIVE, FAILED]
        timeZone:
          type: string
        country:
          type: string
        firstAdministratorMembershipId:
          type: string
          format: uuid
        statusChangedAt: {type: string, format: date-time}
        statusChangedBy: {type: string}
        statusReason: {type: string}
        failedStep: {type: string, enum: [CREATE_ACCOUNT, APPLY_STATUS]}
        visualIdentity:
          $ref: '#/components/schemas/VisualIdentity'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
